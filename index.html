<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
	<title>漢字アプリ</title>
	<link rel="stylesheet" href="./style.css">
	<link rel="icon" href="./kan.ico">
</head>

<body>
	<header id="header">
		<h1 id="header_title">漢字</h1>
		<form class="search_form" action="">
			<input disabled id="search_input" type="text" placeholder="検索">
			<button disabled id="search_btn">🔍</button>
			<button id="stop_search_btn">×</button>
		</form>
		<button disabled id="training_button" class="header_btn" onClick="changeSection('training',this)">練習</button>
	</header>

	<div id="main_background">漢</div>

	<section id="modal_container" class="">
		<div class="modal">
			<div class="modal_content">
			</div>
		</div>
	</section>
	<main>
		<section id="main_section">
			<div id="kanji_result_container">
				<div id="loading_container">
					<p id="loading">ロード中</p>
					<p id="loading_kanji" class="rotating">漢</p>
				</div>
			</div>
			<div id="gmFilter_container">

				<ul id="gmFilter_ul">
					<li class="gmFilter_li"><button id="gmFilter_all" class="gmFilter_btn active"
							onClick="changeGMFilter(0)">全部</button></li>
					<li class="gmFilter_li"><button id="gmFilter_word" class="gmFilter_btn semi_active"
							onClick="changeGMFilter(1)">単語</button></li>
					<li class="gmFilter_li"><button id="gmFilter_gram" class="gmFilter_btn semi_active"
							onClick="changeGMFilter(2)">文法</button></li>
					<li class="gmFilter_li"><button id="gmFilter_example" class="gmFilter_btn semi_active"
							onClick="changeGMFilter(3)">例文</button>
					</li>
				</ul>

				<div id="gm_filters">
					<div id="gmFilter_cat">
						<div>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('Nom',this)">Nom</button>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('いAdj',this)">いAdj</button>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('なAdj',this)">なAdj</button>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('U-Vb',this)">U-Vb</button>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('Ru-Vb',this)">Ru-Vb</button>
						</div>
						<div>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('Irr-Vb',this)">Irr-Vb</button>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('Adv',this)">Adv</button>
							<button class="gmFilter_cat_btn gmFilter_btn" onClick="pushFilterCat('Nb',this)">Nb</button>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('Loc',this)">Loc</button>
							<button class="gmFilter_cat_btn gmFilter_btn"
								onClick="pushFilterCat('Exp',this)">Exp</button>
						</div>
						<button id="gmFilter_cat_search_btn" onClick="searchByCat()">検索</button>
					</div>
					<div id="gmFilter_lesson">
						<div>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('1',this)">1</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('2',this)">2</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('3',this)">3</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('4',this)">4</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('5',this)">5</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('6',this)">6</button>
						</div>
						<div>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('7',this)">7</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('8',this)">8</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('9',this)">9</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('10',this)">10</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('11',this)">11</button>
							<button class="gmFilter_lesson_btn gmFilter_btn"
								onClick="pushFilterLesson('12',this)">12</button>
						</div>
						<button id="gmFilter_cat_search_btn" onClick="searchByLesson()">検索</button>
					</div>
				</div>
				<div id="gm_open_filters_dots">
					<button id="gm_open_filters_btn" onClick="openFilters()">
						<span id="open_filters_dot_1" class="open_filters_dots"></span>
						<span id="open_filters_dot_2" class="open_filters_dots"></span>
						<span id="open_filters_dot_3" class="open_filters_dots"></span>
					</button>
				</div>

			</div>
			<div id="word_result_container"></div>
		</section>
		<section id="training_section">
			<div class="training_type_container">
				<button class="training_type_btn" onClick="openCategory('漢検')">漢検</button>
				<button class="training_type_btn" onClick="openCategory('部首')">部首</button>
				<button class="training_type_btn" onClick="openCategory('その他')">その他</button>
			</div>
			<div id="kanken_container">
				<div id="kanken_lvl_list">
					<ul class="kanken_lvl_btn_row">
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('10',this)">10級</button>
						</li>
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('9',this)">9級</button>
						</li>
						<li class="no_border">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('8',this)">8級</button>
						</li>
					</ul>
					<ul class="kanken_lvl_btn_row">
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('7',this)">7級</button>
						</li>
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('6',this)">6級</button>
						</li>
						<li class="no_border">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('5',this)">5級</button>
						</li>
					</ul>
					<ul class="kanken_lvl_btn_row">
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('4',this)">4級</button>
						</li>
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('3',this)">3級</button>
						</li>
						<li class="no_border">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('準2',this)">準2級</button>
						</li>
					</ul>
					<ul class="kanken_lvl_btn_row">
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('2',this)">2級</button>
						</li>
						<li class="">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('準1',this)">準1級</button>
						</li>
						<li class="no_border">
							<button class="kanken_lvl_btn" onClick="openKankenDialog('1',this)">1級</button>
						</li>
					</ul>
				</div>
			</div>
			<div id="bushu_container">
				<button id="training_bushu_btn" class="normal_btn" onClick="bushuStart()">部首(214)</button>
				<div id="training_bushu_input">
					<input id="bushu_input" class="normal_input" placeholder="部首リスト(ID)" type="text">
					<button id="bushu_input_start_btn" class="normal_btn"
						onClick="bushuStart(0)">部首</button>
				</div>
			</div>
			<div id="sonota_container">
				<button id="training_kotowaza_btn" class="sonota_btn normal_btn" onClick="prepareSonotaTraining('kotowaza', this)">諺</button>
				<button id="training_ateji_btn" class="sonota_btn normal_btn" onClick="prepareSonotaTraining('ateji', this)">当て字</button>
				<button id="training_ijitai_btn" class="sonota_btn normal_btn" onClick="kanjiStart(TRAINING_TYPE.SONOTA, SONOTA_CAT.ITAIJI, this)">異体字</button>
				<div id="sonota_kanji">
					<input id="sonota_input" class="normal_input" placeholder="漢字を入れてください" type="text">
					<button id="sonota_start" class="sonota_btn normal_btn"
						onClick="kanjiStart(TRAINING_TYPE.SONOTA, SONOTA_CAT.KANJI, this)">漢字</button>
				</div>
			</div>
			<div id="training_continue">
				<p>練習中</p>
				<button class="normal_btn" onClick="deleteTrainingData(this)">データを消す</button>
				<button class="normal_btn" onClick="trainingContinue(this)">続ける</button>
			</div>
			<div id="training_container">
				<div class="training_header">
					<button id="training_back_btn" class="normal_btn" onClick="trainingBackBtn(this)">
						<span id="training_back_arrow_1"></span>
						<span id="training_back_arrow_3"></span>
					</button>
					<div id="progress_bar_container">
						<div id="progress_bar"></div>
					</div>
					<div id="training_progression">1/200</div>
				</div>
				<div id="training_zone"></div>
			</div>
			<dialog id="dialog" class="dialog">
				<p class="dialog_text">--- 練習中 ---</p>
				<p class="">ここまでの進行状況を保存しますか？</p>
				<div class="dialog_btn_container">
					<button class="normal_btn dialog_btn" onClick="trainingBack(1, this)">保存して戻る</button>
					<button class="normal_btn dialog_btn" onClick="trainingBack(0, this)">保存しないで戻る</button>
					<button id="kanken_dialog_close_btn" class="normal_btn dialog_btn dialog_close_btn"
						onClick="trainingBack(-1, this)">
						<span id="cross_left"></span>
						<span id="cross_right"></span>
					</button>
				</div>
			</dialog>
			<dialog id="kanken_dialog" class="dialog">
				<p class="kanken_dialog_text">設問を選んでください</p>
				<div class="kanken_dialog_btn_container">
					<button id="kd_btn_yomi" class="normal_btn dialog_btn"
						onClick="prepareKankenTest(KANKEN_CAT.WORD_YOMI, this)">読み</button>
					<button class="normal_btn dialog_btn"
						onClick="prepareKankenTest(KANKEN_CAT.WORD_KAKI, this)">書き取り(単語)</button>
					<button class="normal_btn dialog_btn"
						onClick="prepareKankenTest(KANKEN_CAT.KANJI, this)">書き取り(漢字)</button>
					<button class="normal_btn dialog_btn"
						onClick="prepareKankenTest(KANKEN_CAT.BUSHU, this)">部首</button>
					<button id="yojijukugo_yomi_btn" class="normal_btn dialog_btn"
						onClick="prepareKankenTest(KANKEN_CAT.YOJI_YOMI, this)">四字熟語(読み)</button>
					<button id="yojijukugo_kaki_btn" class="normal_btn dialog_btn"
						onClick="prepareKankenTest(KANKEN_CAT.YOJI_KAKI, this)">四字熟語(書き)</button>
					<button id="kanken_dialog_close_btn" class="normal_btn dialog_btn dialog_close_btn"
						onClick="closeKankenDialog(this)">
						<span id="cross_left"></span>
						<span id="cross_right"></span>
					</button>
				</div>
			</dialog>
			<dialog id="kanken_setting_dialog" class="dialog">
				<p class="kanken_dialog_text">練習設定</p>
				<div class="kanken_setting_main_container">
					<button id="kanken_all_btn" class="normal_btn dialog_btn"
						onClick="filteredKankenStart(this,0)">全部</button>

					<div class="kanken_setting_separator"></div>

					<div class="kanken_setting_list_container">
						<div class="kanken_input_div">
							<label for="kanken_range_input">数</label>
							<input id="kanken_range_input" class="kanken_range_input" value="100" type="number">
							<button class="normal_btn" onClick="changeKankenRange()">OK</button>
							<div id="kanken_setting_yoji_prio_switch" class="switch_btn_container" onClick="switchBtn(this, priorityKankenStart)">
								<div id="kanken_setting_yoji_prio_switch_btn" class="switch_btn"></div>
								<p id="kanken_setting_yoji_prio_label" class="switch_btn_label">優先</p>
							</div>
						</div>
						<ol id="kanken_list_possibilities" class="kanken_list_possibilities"></ol>
						<button id="kanken_range_btn" class="normal_btn dialog_btn"
							onClick="filteredKankenStart(this)">GO</button>
					</div>
				</div>
				<div class="kanken_setting_close">
					<button id="kanken_dialog_close_btn" class="normal_btn dialog_btn dialog_close_btn"
						onClick="closeKankenSettingDialog(this)">
						<span id="cross_left"></span>
						<span id="cross_right"></span>
					</button>
				</div>
			</dialog>
			<dialog id="sonota_dialog" class="dialog">
				<div id="sonota_dialog_btn_container"></div>
				<button id="" class="normal_btn dialog_btn dialog_close_btn"
					onClick="closeSonotaDialog(this)">
					<span id="cross_left"></span>
					<span id="cross_right"></span>
				</button>
			</dialog>
		</section>
	</main>
	<dialog id="alert_dialog" class="dialog">
		<div>
			<p id="alert_dialog_text">Aucun kanji connu détecté</p>
			<button class="normal_btn dialog_close_btn" onClick="closeAlertDialog(this)">
				<span id="cross_left"></span>
				<span id="cross_right"></span>
			</button>
		</div>
	</dialog>

	<dialog id="export_furigana_dialog" class="dialog">
		<div>
			<textarea id="furigana_dialog_text"></textarea>
			<button class="normal_btn furigana_dialog_copy_btn" onClick="copyExport()">COPY</button>
			<button class="normal_btn dialog_close_btn" onClick="closeFuriganaDialog(this)">
				<span id="cross_left"></span>
				<span id="cross_right"></span>
			</button>
		</div>
	</dialog>

	<div id="filter_panel">
		<div class="filter_section">
			<h2 class="filter_section_title top">漢字検索</h2>
			<button class="filter_section_btn" onClick="displayAllKanji()">全部</button>
			<button class="filter_section_btn" onClick="displayKanjiBy(KANJI_BY.STROKE)">画数</button>
			<button class="filter_section_btn" onClick="displayKanjiBy(KANJI_BY.BUSHU)">部首</button>
			<button class="filter_section_btn" onClick="displayKanjiBy(KANJI_BY.KANKEN)">漢検</button>
			<button class="filter_section_btn bottom"><span class="disabled_yomi">読み</span></button>
		</div>
		<div class="filter_section">
			<h2 class="filter_section_title">カテゴリー</h2>
			<button id="kanken_lvl_btn" class="filter_section_btn" onClick="openKankenLvl()">
				<span id="span_arrow_down_1_1" class="kanken_lvl_span_arrow"></span>
				<span id="span_arrow_down_1_2" class="kanken_lvl_span_arrow"></span>
				漢検
				<span id="span_arrow_down_2_1" class="kanken_lvl_span_arrow"></span>
				<span id="span_arrow_down_2_2" class="kanken_lvl_span_arrow"></span>
			</button>
			<div id="filter_section_kanken">
				<ul class="filter_section_kanken_btn_line">
					<li><button class="filter_section_kanken_btn" onClick="displayKankenList('10')">10級</button></li>
					<li><button class="filter_section_kanken_btn" onClick="displayKankenList('9')">9級</button></li>
					<li><button class="filter_section_kanken_btn right" onClick="displayKankenList('8')">8級</button></li>
				</ul>
				<ul class="filter_section_kanken_btn_line">
					<li><button class="filter_section_kanken_btn" onClick="displayKankenList('7')">7級</button></li>
					<li><button class="filter_section_kanken_btn" onClick="displayKankenList('6')">6級</button></li>
					<li><button class="filter_section_kanken_btn right" onClick="displayKankenList('5')">5級</button></li>
				</ul>
				<ul class="filter_section_kanken_btn_line">
					<li><button class="filter_section_kanken_btn" onClick="displayKankenList('4')">4級</button></li>
					<li><button class="filter_section_kanken_btn" onClick="displayKankenList('3')">3級</button></li>
					<li><button class="filter_section_kanken_btn right" onClick="displayKankenList('準2')">準2級</button></li>
				</ul>
				<ul class="filter_section_kanken_btn_line">
					<li><button class="filter_section_kanken_btn bottom" onClick="displayKankenList('2')">2級</button></li>
					<li><button class="filter_section_kanken_btn bottom" onClick="displayKankenList('準1')">準1級</button></li>
					<li><button class="filter_section_kanken_btn bottom right" onClick="displayKankenList('1')">1級</button></li>
				</ul>
			</div>
			<button class="filter_section_btn" onClick="displayYojijukugo()">四字熟語</button>
			<button class="filter_section_btn" onClick="search('','諺')">諺</button>
			<button class="filter_section_btn bottom" onClick="search('','当て字')">当て字</button>
		</div>
		<div class="filter_section">
			<h2 class="filter_section_title">モード</h2>
			<button id="filter_section_genki" class="filter_section_btn"
				onClick="changeMainMode(MODE.GENKI)">げんき</button>
			<button id="filter_section_minna" class="filter_section_btn"
				onClick="changeMainMode(MODE.MINNA)">みんな</button>
		</div>
	</div>
	<dialog id="loading_dialog">
		<div class="loading_text">
			ロード中
		</div>
	</dialog>

	<div id="footer_display_type" onClick="changeDisplayType()">
		<div id="display_type">
			<div id="dt_1">
				<span id="sdt_1_1" class="span_display_type_1"></span>
				<span id="sdt_1_2" class="span_display_type_2"></span>
				<span id="sdt_1_3" class="span_display_type_3"></span>
			</div>
			<div id="dt_2">
				<span id="sdt_2_1" class="span_display_type_1"></span>
				<span id="sdt_2_2" class="span_display_type_2"></span>
				<span id="sdt_2_3" class="span_display_type_3"></span>
			</div>
			<div id="dt_3">
				<span id="sdt_3_1" class="span_display_type_1"></span>
				<span id="sdt_3_2" class="span_display_type_2"></span>
				<span id="sdt_3_3" class="span_display_type_3"></span>
			</div>
		</div>
	</div>
	<div id="footer_zone" class="">
		<button id="footer_menu_btn" class="" onClick="footerMainBtn()">
			<span id="span_1"></span>
			<span id="span_2"></span>
			<span id="span_3"></span>
		</button>
	</div>

	<script src="./class/word.js"></script>
	<script src="./class/kanji.js"></script>
	<script src="./class/genki.js"></script>
	<script src="./class/minna.js"></script>
	<script src="./start.js"></script>
	<script src="./section/main.js"></script>
	<script src="./section/trainingSection.js"></script>
	<script src="./section/genki_minna.js"></script>
	<script src="./keyboard.js"></script>
</body>

</html>
